name: eurusd-trading-lifecycle
version: 1.0
states:
  - CREATED
  - READY
  - ANALYZING
  - SIGNAL_PROPOSED
  - RISK_REVIEW
  - APPROVED
  - REJECTED
  - ORDER_SUBMITTED
  - FILLED
  - POSITION_OPEN
  - POSITION_CLOSED
  - POST_TRADE
  - COMPLETED
  - FAILED
  - HALTED
transitions:
  CREATED: [READY]
  READY: [ANALYZING]
  ANALYZING: [SIGNAL_PROPOSED, READY]
  SIGNAL_PROPOSED: [RISK_REVIEW]
  RISK_REVIEW: [APPROVED, REJECTED, HALTED]
  APPROVED: [ORDER_SUBMITTED]
  REJECTED: [COMPLETED]
  ORDER_SUBMITTED: [FILLED, FAILED]
  FILLED: [POSITION_OPEN]
  POSITION_OPEN: [POSITION_CLOSED, HALTED]
  POSITION_CLOSED: [POST_TRADE]
  POST_TRADE: [COMPLETED]
